name: Publish existing dsh-useful-tools 0.1.2
on:
  push:
    branches:
      - release/v0.1.2
permissions:
  contents: write
concurrency:
  group: publish-dsh-useful-tools-v0.1.2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify and publish the existing installation archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64
          import hashlib
          import io
          import json
          import os
          import tarfile
          import urllib.parse
          import urllib.request
          
          repo = "B3000Kcn/dsh-useful-tools"
          api_root = "https://api.github.com/repos/" + repo
          archive_name = "dsh-useful-tools-0.1.2.tgz"
          archive_digest = "fafe561ce0327c0e7b186a7eaeaa54ac0c79e6a32b8946d4e638347b07828356"
          target = "bcbb874abfd4997ab79ee8a14f66aa70961eab58"
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          
          def request(method, url, data=None, content_type=None):
              allowed = {"api.github.com", "uploads.github.com"}
              parsed = urllib.parse.urlsplit(url)
              assert parsed.scheme == "https" and parsed.hostname in allowed
              current_headers = dict(headers)
              if isinstance(data, dict):
                  data = json.dumps(data).encode()
                  content_type = "application/json"
              if content_type:
                  current_headers["Content-Type"] = content_type
              req = urllib.request.Request(url, data=data, headers=current_headers, method=method)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          
          blob = request("GET", api_root + "/git/blobs/a44f68a15323140175a22854a43179a1b603bf8f")
          archive = base64.b64decode(blob["content"])
          checksum_blob = request("GET", api_root + "/git/blobs/2a0523955265dd17e5e3c1449e78371d4287bf10")
          checksum = base64.b64decode(checksum_blob["content"])
          assert checksum == (archive_digest + "  " + archive_name + "\n").encode()
          assert len(archive) == 27611
          assert hashlib.sha256(archive).hexdigest() == archive_digest
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as package:
              manifest = json.load(package.extractfile("package/package.json"))
              assert manifest["name"] == "dsh-useful-tools" and manifest["version"] == "0.1.2"
          
          assets = {
              archive_name: archive,
              archive_name + ".sha256": checksum,
          }
          releases = request("GET", api_root + "/releases?per_page=100")
          release = next((item for item in releases if item["tag_name"] == "v0.1.2"), None)
          if release is None:
              release = request("POST", api_root + "/releases", {
                  "tag_name": "v0.1.2",
                  "target_commitish": target,
                  "name": "dsh-useful-tools 0.1.2",
                  "body": """发布现有 dsh-useful-tools 0.1.2 安装包，文件保持原样。
          
          下载 dsh-useful-tools-0.1.2.tgz 和同名 .sha256 文件，放在同一目录后执行：
          
          ```sh
          sha256sum -c dsh-useful-tools-0.1.2.tgz.sha256
          dsh plugin --profile web add /绝对路径/dsh-useful-tools-0.1.2.tgz
          ```
          
          将 web 替换为实际 profile。安装后重启 DSH 并刷新网页。兼容范围为 DSH 0.2.1-rc.2 和 0.2.2-alpha.2；启用 VCP 消息树时需配套 dsh-vcp-specific-ui 0.2.16 并重启。尚未在目标实例验证。
          
          安装包 SHA256：fafe561ce0327c0e7b186a7eaeaa54ac0c79e6a32b8946d4e638347b07828356""",
                  "draft": True,
                  "prerelease": False,
              })
          assert release["target_commitish"] == target, "Existing release targets a different commit"
          existing = {item["name"]: item for item in request("GET", release["assets_url"])}
          for name, data in assets.items():
              expected = "sha256:" + hashlib.sha256(data).hexdigest()
              if name in existing:
                  assert existing[name]["size"] == len(data)
                  assert existing[name].get("digest") == expected, "Existing asset differs; refusing to replace it"
              else:
                  upload_url = release["upload_url"].split("{")[0] + "?" + urllib.parse.urlencode({"name": name})
                  uploaded = request("POST", upload_url, data, "application/octet-stream")
                  assert uploaded["size"] == len(data) and uploaded.get("digest") == expected
                  print("Uploaded " + name)
          verified = {item["name"]: item for item in request("GET", release["assets_url"])}
          for name, data in assets.items():
              assert verified[name]["state"] == "uploaded"
              assert verified[name]["digest"] == "sha256:" + hashlib.sha256(data).hexdigest()
          if release["draft"]:
              release = request("PATCH", release["url"], {"draft": False, "make_latest": "true"})
          assert release["draft"] is False
          print(release["html_url"])
